<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">Better Call Saul pixel billboard</title>
  <desc id="desc">An original pixel-style yellow, black, and red open-source dispute fixer billboard with a stylized lawyer figure.</desc>
  <defs>
    <pattern id="pixel-grid" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect x="6" y="0" width="1" height="7" fill="#000" opacity="0.025"/>
      <rect x="0" y="6" width="7" height="1" fill="#000" opacity="0.025"/>
    </pattern>
    <filter id="paper-noise" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g shape-rendering="crispEdges" filter="url(#paper-noise)">
    <rect width="700" height="420" fill="#f3d94d"/>
    <rect width="700" height="362" fill="url(#pixel-grid)"/>

    <!-- Bottom disclaimer strip -->
    <rect x="0" y="362" width="700" height="58" fill="#c92127"/>
    <rect x="0" y="362" width="700" height="5" fill="#1a1714"/>
    <text x="350" y="396" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif"
          font-size="15" font-weight="900" fill="#f3d94d">
      NOT LEGAL ADVICE - OPEN SOURCE - GITHUB.COM/ZZY2289/BETTER-CALL-SAUL
    </text>

    <!-- Small dispute notes -->
    <g fill="#15120f" font-family="Helvetica, Arial, sans-serif" font-weight="900">
      <g transform="translate(52 40) rotate(-8)">
        <rect x="0" y="28" width="82" height="9"/>
        <rect x="14" y="17" width="50" height="12"/>
        <rect x="58" y="21" width="22" height="8"/>
        <circle cx="22" cy="41" r="6" fill="#f3d94d"/>
        <circle cx="62" cy="41" r="6" fill="#f3d94d"/>
        <text x="6" y="12" font-size="13">REFUND</text>
        <text x="31" y="55" font-size="12">DENIED</text>
      </g>
      <text x="270" y="42" font-size="17" transform="rotate(-9 270 42)">CHARGEBACK?</text>
      <text x="388" y="112" font-size="13" transform="rotate(9 388 112)">BAD CONTRACT</text>
      <text x="32" y="207" font-size="13" transform="rotate(-8 32 207)">LANDLORD</text>
      <text x="37" y="225" font-size="13" transform="rotate(-8 37 225)">TOOK IT</text>
      <text x="238" y="336" font-size="15" transform="rotate(-4 238 336)">DEBT OWED</text>
      <text x="72" y="350" font-size="13" transform="rotate(7 72 350)">SERVICE FAIL</text>
    </g>

    <!-- Slanted headline banner -->
    <g transform="translate(62 103) rotate(-10)">
      <polygon points="0,0 294,0 304,38 10,42" fill="#15120f"/>
      <text x="153" y="29" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="24" font-weight="900" fill="#f3d94d">IN A DISPUTE?</text>
    </g>

    <!-- Main red billboard type -->
    <g fill="#c92127" font-family="Helvetica, Arial, sans-serif" font-weight="900">
      <text x="54" y="184" font-size="68" transform="skewX(-10)">BETTER</text>
      <text x="111" y="250" font-size="55" transform="skewX(-10)">CALL</text>
      <text x="65" y="323" font-size="84" transform="skewX(-10)">SAUL!</text>
    </g>

    <!-- Accent pixels around the main text -->
    <g fill="#15120f">
      <rect x="306" y="261" width="6" height="24"/>
      <rect x="321" y="254" width="5" height="31"/>
      <rect x="337" y="261" width="6" height="24"/>
      <rect x="291" y="278" width="12" height="5"/>
      <rect x="348" y="278" width="12" height="5"/>
      <rect x="301" y="244" width="5" height="12"/>
      <rect x="347" y="244" width="5" height="12"/>
      <rect x="293" y="299" width="5" height="13"/>
      <rect x="351" y="299" width="5" height="13"/>
    </g>
    <text x="326" y="292" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif"
          font-size="17" font-weight="900" fill="#15120f">PROOF</text>

    <!-- Call-to-action badge -->
    <g transform="translate(403 306)">
      <circle cx="0" cy="0" r="37" fill="#15120f"/>
      <text x="0" y="-6" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="13" font-weight="900" fill="#f3d94d">SCRIPT</text>
      <text x="0" y="14" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="18" font-weight="900" fill="#f3d94d">IT NOW</text>
      <rect x="-3" y="-51" width="6" height="12" fill="#15120f"/>
      <rect x="-3" y="39" width="6" height="12" fill="#15120f"/>
      <rect x="-52" y="-3" width="12" height="6" fill="#15120f"/>
      <rect x="40" y="-3" width="12" height="6" fill="#15120f"/>
    </g>

    <!-- Original pixel lawyer figure -->
    <g>
      <!-- Suit mass -->
      <path d="M452 362 L466 285 L494 244 L536 230 L596 235 L650 260 L700 286 L700 362 Z" fill="#15120f"/>
      <path d="M555 232 L590 242 L571 362 L514 362 L502 259 Z" fill="#0b0a09"/>
      <path d="M495 249 L533 237 L521 362 L463 362 L474 289 Z" fill="#1d1915"/>

      <!-- Shirt and tie cutouts -->
      <polygon points="515,253 553,250 543,362 499,362" fill="#f3d94d"/>
      <polygon points="532,266 550,286 541,362 520,362 513,288" fill="#15120f"/>
      <rect x="521" y="271" width="16" height="10" fill="#f3d94d"/>
      <rect x="527" y="292" width="13" height="11" fill="#f3d94d"/>

      <!-- Neck -->
      <polygon points="523,211 560,211 559,249 512,255 509,231" fill="#15120f"/>
      <polygon points="526,214 557,214 552,242 516,247 514,230" fill="#f3d94d"/>

      <!-- Head outline and hair -->
      <path d="M493 93 L505 70 L531 58 L568 60 L598 78 L615 106 L618 145 L606 181 L579 207 L545 218 L512 209 L490 185 L480 150 L482 117 Z" fill="#15120f"/>
      <polygon points="511,86 538,72 570,77 594,101 604,132 598,163 577,190 545,205 516,197 497,174 490,141 493,112" fill="#f3d94d"/>
      <path d="M492 103 L510 75 L539 61 L572 62 L602 83 L618 116 L616 147 L604 134 L594 104 L568 84 L539 80 L513 91 Z" fill="#15120f"/>
      <rect x="580" y="139" width="18" height="38" fill="#15120f"/>
      <rect x="496" y="121" width="19" height="10" fill="#15120f"/>
      <rect x="502" y="136" width="13" height="8" fill="#15120f"/>

      <!-- Face details: brows, eyes, nose, smile, cheek -->
      <rect x="522" y="123" width="30" height="8" fill="#15120f"/>
      <rect x="566" y="124" width="22" height="8" fill="#15120f"/>
      <rect x="530" y="139" width="21" height="9" fill="#15120f"/>
      <rect x="570" y="140" width="18" height="8" fill="#15120f"/>
      <rect x="555" y="145" width="10" height="10" fill="#15120f"/>
      <rect x="560" y="155" width="12" height="8" fill="#15120f"/>
      <rect x="548" y="177" width="38" height="7" fill="#15120f"/>
      <rect x="560" y="187" width="20" height="6" fill="#15120f"/>
      <rect x="513" y="165" width="25" height="7" fill="#15120f"/>
      <rect x="603" y="142" width="10" height="29" fill="#f3d94d"/>

      <!-- Pointing arm and hand, original pose -->
      <path d="M459 238 L428 218 L413 192 L431 178 L465 194 L500 224 L492 258 Z" fill="#15120f"/>
      <path d="M419 185 L389 171 L364 174 L349 188 L355 205 L386 207 L407 221 L432 216 Z" fill="#15120f"/>
      <polygon points="356,187 389,181 421,192 430,211 405,219 382,207 357,207" fill="#f3d94d"/>
      <rect x="325" y="189" width="51" height="13" fill="#15120f"/>
      <rect x="320" y="193" width="42" height="6" fill="#f3d94d"/>
      <rect x="383" y="191" width="13" height="7" fill="#15120f"/>
      <rect x="392" y="202" width="32" height="8" fill="#15120f"/>
      <rect x="374" y="214" width="34" height="8" fill="#15120f"/>
      <rect x="355" y="198" width="10" height="12" fill="#15120f"/>

      <!-- Lapels and shoulder pixel breaks -->
      <polygon points="489,252 517,267 496,304 475,286" fill="#f3d94d"/>
      <polygon points="566,247 550,267 571,304 594,276" fill="#f3d94d"/>
      <rect x="632" y="285" width="68" height="20" fill="#0b0a09"/>
      <rect x="650" y="305" width="50" height="57" fill="#0b0a09"/>
      <rect x="452" y="331" width="32" height="31" fill="#0b0a09"/>
    </g>
  </g>
</svg>
