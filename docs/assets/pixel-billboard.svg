<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <defs>
    <radialGradient id="bkgd" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#111128"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="700" height="4" patternUnits="userSpaceOnUse">
      <rect width="700" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <!-- Canvas (GitHub dark-mode background) -->
  <rect width="700" height="280" fill="#0d1117"/>

  <!-- Billboard surface -->
  <rect x="14" y="14" width="672" height="252" fill="url(#bkgd)"/>

  <!-- ═══ OUTER BORDER — gold 8 px ═══ -->
  <rect x="14"  y="14"  width="672" height="8" fill="#f5a623"/>
  <rect x="14"  y="258" width="672" height="8" fill="#f5a623"/>
  <rect x="14"  y="22"  width="8"   height="236" fill="#f5a623"/>
  <rect x="678" y="22"  width="8"   height="236" fill="#f5a623"/>

  <!-- ═══ INNER BORDER — gold 4 px ═══ -->
  <rect x="30" y="30"  width="640" height="4" fill="#f5a623" opacity="0.65"/>
