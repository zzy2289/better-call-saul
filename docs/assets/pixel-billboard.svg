  <!-- ═══ SUBTITLE ═══ -->
  <text x="350" y="172" text-anchor="middle"
        font-family="'Courier New','Consolas','Liberation Mono',monospace"
        font-weight="700" font-size="17" letter-spacing="0.35em"
        fill="#7ec8e3">AI DISPUTE FIXER</text>

  <!-- ═══ CHINESE TAGLINE ═══ -->
  <text x="350" y="204" text-anchor="middle"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="15" letter-spacing="0.6em"
        fill="#e94560">纠纷终结者</text>

  <!-- Scanline overlay for retro CRT feel -->
  <rect x="34" y="34" width="632" height="212" fill="url(#scan)" opacity="0.6"/>
