  <circle cx="370" cy="254" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="410" cy="254" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="450" cy="254" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="490" cy="254" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="530" cy="254" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="570" cy="254" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="610" cy="254" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="650" cy="254" r="2.5" fill="#e94560" opacity="0.9"/>

