        font-weight="900" font-size="42" letter-spacing="0.12em"
        fill="#f5a623" filter="url(#glow)">BETTER CALL SAUL</text>

  <!-- Pixel dot divider -->
  <g fill="#f5a623" opacity="0.45">
    <rect x="252" y="136" width="4" height="4"/>
    <rect x="264" y="136" width="4" height="4"/>
    <rect x="276" y="136" width="4" height="4"/>
    <rect x="288" y="136" width="4" height="4"/>
    <rect x="300" y="136" width="4" height="4"/>
    <rect x="312" y="136" width="4" height="4"/>
    <rect x="324" y="136" width="4" height="4"/>
    <rect x="336" y="136" width="4" height="4"/>
    <rect x="348" y="136" width="4" height="4"/>
    <rect x="360" y="136" width="4" height="4"/>
    <rect x="372" y="136" width="4" height="4"/>
    <rect x="384" y="136" width="4" height="4"/>
    <rect x="396" y="136" width="4" height="4"/>
    <rect x="408" y="136" width="4" height="4"/>
    <rect x="420" y="136" width="4" height="4"/>
    <rect x="432" y="136" width="4" height="4"/>
