  <circle cx="674" cy="54"  r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="674" cy="94"  r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="674" cy="134" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="674" cy="174" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="674" cy="214" r="2.5" fill="#f5a623" opacity="0.85"/>

