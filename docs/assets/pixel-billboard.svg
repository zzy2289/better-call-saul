    <rect x="340" y="42" width="5" height="5" opacity="0.35"/>
    <rect x="355" y="42" width="5" height="5" opacity="0.35"/>
    <rect x="345" y="49" width="5" height="5" opacity="0.55"/>
    <rect x="350" y="49" width="5" height="5" opacity="0.55"/>
    <!-- Earpiece left -->
    <rect x="330" y="58" width="5" height="5"/>
    <rect x="335" y="58" width="5" height="5"/>
    <!-- Earpiece right -->
    <rect x="360" y="58" width="5" height="5"/>
    <rect x="365" y="58" width="5" height="5"/>
    <!-- Body -->
    <rect x="330" y="63" width="5" height="5"/>
    <rect x="340" y="63" width="5" height="5"/>
    <rect x="345" y="63" width="5" height="5"/>
    <rect x="350" y="63" width="5" height="5"/>
    <rect x="355" y="63" width="5" height="5"/>
    <rect x="365" y="63" width="5" height="5"/>
    <!-- Base curve -->
    <rect x="335" y="68" width="5" height="5"/>
    <rect x="340" y="68" width="5" height="5"/>
    <rect x="345" y="68" width="5" height="5"/>
    <rect x="350" y="68" width="5" height="5"/>
    <rect x="355" y="68" width="5" height="5"/>
    <rect x="360" y="68" width="5" height="5"/>
  </g>

  <!-- ═══ TITLE ═══ -->
  <text x="350" y="120" text-anchor="middle"
