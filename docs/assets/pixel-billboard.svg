  <rect x="22" y="250" width="8" height="8" fill="#f5a623"/>
  <rect x="670" y="250" width="8" height="8" fill="#f5a623"/>

  <!-- ═══ MARQUEE LIGHTS — top ═══ -->
  <circle cx="50"  cy="26" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="90"  cy="26" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="130" cy="26" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="170" cy="26" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="210" cy="26" r="2.5" fill="#e94560" opacity="0.9"/>
  <circle cx="250" cy="26" r="2.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="290" cy="26" r="2.5" fill="#e94560" opacity="0.9"/>
