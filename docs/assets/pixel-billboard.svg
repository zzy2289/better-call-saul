<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <pattern id="px" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" y="7" fill="rgba(0,0,0,0.02)"/>
      <rect width="1" height="8" x="7" fill="rgba(0,0,0,0.02)"/>
    </pattern>
  </defs>

  <!-- ═══ MUSTARD YELLOW BACKGROUND ═══ -->
  <rect width="700" height="420" fill="#f0d648"/>

  <!-- ═══ BOTTOM RED BAR ═══ -->
  <rect y="365" width="700" height="55" fill="#cc2a2a"/>
  <text x="350" y="397" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace" font-weight="700"
        font-size="13" letter-spacing="0.1em" fill="#f0d648">OPEN SOURCE · FREE · GITHUB.COM/ZZY2289/BETTER-CALL-SAUL</text>

  <!-- ═══ "GOT A DISPUTE?" BLACK BANNER ═══ -->
  <rect x="55" y="52" width="295" height="34" fill="#1a1a1a"/>
  <text x="202" y="76" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace" font-weight="700"
        font-size="18" letter-spacing="0.25em" fill="#f0d648">GOT A DISPUTE?</text>

  <!-- ═══ SCATTERED DISPUTE LABELS ═══ -->
  <text x="55" y="42"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-weight="900" font-size="15" fill="#1a1a1a"
        transform="rotate(-8,55,42)">退款被拒</text>

  <text x="362" y="50"
        font-family="'Courier New',monospace"
        font-weight="900" font-size="14" fill="#1a1a1a"
        transform="rotate(5,362,50)">SCAM ALERT</text>

  <text x="38" y="175"
        font-family="'Courier New',monospace"
        font-weight="900" font-size="14" fill="#1a1a1a"
        transform="rotate(-10,38,175)">DEPOSIT STOLEN</text>

  <text x="355" y="145"
        font-family="'Courier New',monospace"
        font-weight="900" font-size="13" fill="#1a1a1a"
        transform="rotate(6,355,145)">BAD SERVICE</text>

  <text x="48" y="245"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-weight="900" font-size="14" fill="#1a1a1a"
        transform="rotate(5,48,245)">被骗了?</text>

  <text x="60" y="340"
        font-family="'Courier New',monospace"
        font-weight="900" font-size="13" fill="#1a1a1a"
        transform="rotate(6,60,340)">BAD LANDLORD</text>

  <text x="245" y="350"
        font-family="'Courier New',monospace"
        font-weight="900" font-size="14" fill="#1a1a1a"
        transform="rotate(-4,245,350)">DEBT OWED</text>

  <!-- ═══ MAIN TEXT: BETTER CALL SAUL ═══ -->
  <text x="65" y="148"
        font-family="Impact,'Arial Black',Helvetica,Arial,sans-serif"
        font-weight="900" font-size="58" fill="#cc2a2a"
        font-style="italic" letter-spacing="0.02em">BETTER</text>
  <text x="120" y="222"
        font-family="Impact,'Arial Black',Helvetica,Arial,sans-serif"
        font-weight="900" font-size="62" fill="#cc2a2a"
        font-style="italic" letter-spacing="0.02em">CALL</text>
  <text x="140" y="305"
        font-family="Impact,'Arial Black',Helvetica,Arial,sans-serif"
        font-weight="900" font-size="78" fill="#cc2a2a"
        font-style="italic" letter-spacing="0.01em">SAUL!</text>

  <!-- ═══ "FIX IT NOW" CIRCLE BADGE ═══ -->
  <circle cx="415" cy="325" r="32" fill="#1a1a1a"/>
  <text x="415" y="320" text-anchor="middle"
        font-family="Impact,'Arial Black',sans-serif" font-weight="900"
        font-size="12" fill="#f0d648" letter-spacing="0.1em">FIX IT</text>
  <text x="415" y="337" text-anchor="middle"
        font-family="Impact,'Arial Black',sans-serif" font-weight="900"
        font-size="15" fill="#f0d648" letter-spacing="0.08em">NOW</text>
  <!-- Starburst rays -->
  <g fill="#1a1a1a">
    <rect x="413" y="286" width="4" height="6"/>
    <rect x="389" y="299" width="4" height="4"/>
    <rect x="437" y="299" width="4" height="4"/>
    <rect x="378" y="323" width="6" height="4"/>
    <rect x="452" y="323" width="6" height="4"/>
    <rect x="389" y="347" width="4" height="4"/>
    <rect x="437" y="347" width="4" height="4"/>
    <rect x="413" y="360" width="4" height="6"/>
  </g>

  <!-- ═══ PIXEL CHARACTER SILHOUETTE (p=8, x0=456, y0=37) ═══ -->
  <g fill="#1a1a1a">
    <!-- Hair -->
    <rect x="504" y="37" width="40" height="8"/>
    <rect x="496" y="45" width="56" height="8"/>
    <!-- Head -->
    <rect x="488" y="53" width="64" height="24"/>
    <!-- Nose profile extends left -->
    <rect x="480" y="77" width="72" height="8"/>
    <!-- Mouth / jaw -->
    <rect x="488" y="85" width="56" height="8"/>
    <rect x="496" y="93" width="48" height="8"/>
    <!-- Neck -->
    <rect x="504" y="101" width="32" height="8"/>
    <!-- Collar -->
    <rect x="496" y="109" width="48" height="8"/>
    <!-- Shoulders build-up -->
    <rect x="480" y="117" width="88" height="8"/>
    <rect x="472" y="125" width="104" height="8"/>
    <rect x="464" y="133" width="120" height="8"/>
    <!-- Chest -->
    <rect x="456" y="141" width="128" height="8"/>
    <!-- Arm starts (connected to body) -->
    <rect x="432" y="149" width="152" height="8"/>
    <!-- Forearm (separates from body) -->
    <rect x="400" y="157" width="40" height="8"/>
    <rect x="496" y="157" width="80" height="8"/>
    <!-- Hand -->
    <rect x="368" y="165" width="40" height="8"/>
    <rect x="504" y="165" width="72" height="8"/>
    <!-- Pointing finger -->
    <rect x="352" y="173" width="24" height="8"/>
    <!-- Torso (finger row body merges into torso) -->
    <rect x="504" y="173" width="64" height="24"/>
    <!-- Mid-body -->
    <rect x="496" y="197" width="72" height="32"/>
    <!-- Waist -->
    <rect x="496" y="229" width="64" height="24"/>
    <!-- Upper legs -->
    <rect x="496" y="253" width="32" height="40"/>
    <rect x="536" y="253" width="24" height="40"/>
    <!-- Lower legs -->
    <rect x="496" y="293" width="32" height="24"/>
    <rect x="536" y="293" width="32" height="24"/>
    <!-- Ankles -->
    <rect x="496" y="317" width="32" height="8"/>
    <rect x="544" y="317" width="24" height="8"/>
    <!-- Feet (wider) -->
    <rect x="488" y="325" width="48" height="24"/>
    <rect x="536" y="325" width="40" height="24"/>
  </g>

  <!-- ═══ PIXEL GRID OVERLAY (retro CRT feel) ═══ -->
  <rect width="700" height="365" fill="url(#px)"/>
</svg>
