<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#1a1a2e"/>
  <!-- Accent ring -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <!-- Phone icon -->
  <g transform="translate(128,118) scale(3.2)" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handset -->
    <path d="M-12,6 C-12,6 -14,2 -14,-2 C-14,-6 -12,-10 -8,-10 L-6,-10 L-6,-4 L-8,-2" fill="none"/>
    <path d="M12,6 C12,6 14,2 14,-2 C14,-6 12,-10 8,-10 L6,-10 L6,-4 L8,-2" fill="none"/>
    <path d="M-8,-2 C-6,4 6,4 8,-2" fill="none"/>
    <!-- Ring waves -->
    <path d="M-4,-14 C-2,-16 2,-16 4,-14" opacity="0.5"/>
    <path d="M-6,-18 C-2,-22 2,-22 6,-18" opacity="0.3"/>
  </g>
  <!-- Text -->
  <text x="128" y="185" font-family="Georgia, serif" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="bold">BETTER CALL</text>
  <text x="128" y="212" font-family="Georgia, serif" font-size="28" fill="#f5a623" text-anchor="middle" font-weight="bold">SAUL</text>
</svg>
